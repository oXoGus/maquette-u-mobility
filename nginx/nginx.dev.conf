# nginx — DÉVELOPPEMENT (docker-compose.dev.yml)
# Sert dist/, reconstruit à chaud par scripts/dev.py --watch-only. Aucun cache : un rechargement montre la dernière version.
server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;
    charset utf-8;

    sendfile off;                      # évite de servir un fichier périmé sur un volume monté
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    access_log /dev/stdout;
    error_log  /dev/stderr info;

    location / {
        # /recherche → recherche.html (même comportement que GitHub Pages)
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        autoindex on;                  # pratique pour vérifier les fichiers en dev
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
